# Anthropic native Messages API profile for Claude Sonnet 4.6 with thinking disabled.
provider: anthropic
# Upstream model id used by Anthropic.
model: claude-sonnet-4-6
# API key environment variable.
api_key_env: ANTHROPIC_API_KEY
# Anthropic API root. The client appends /v1/messages.
base_url: https://api.anthropic.com
# Output token cap for this profile.
max_tokens: 16384
# HTTP timeout in seconds.
request_timeout: 180.0
# Sampling temperature. Anthropic only sends this when thinking is disabled.
temperature: 1.0
# Whether the app may send image inputs to this profile.
vision: true

# Explicitly disable adaptive thinking for this profile.
thinking:
  type: disabled

# Native Anthropic output_config payload.
output_config:
  effort: low
