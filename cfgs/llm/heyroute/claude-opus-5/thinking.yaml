# Heyroute Anthropic-compatible Messages API profile for Claude Opus 5 with adaptive thinking.
provider: heyroute
# Upstream model id used by Anthropic.
model: claude-opus-5
# API key environment variable.
api_key_env: HEYROUTE_API_KEY
# Heyroute gateway root. The client appends /v1/messages.
base_url: https://heyroute.ai/
# Output token cap for this profile.
max_tokens: 128000
# HTTP timeout in seconds.
request_timeout: 600.0
# Sampling temperature. Anthropic omits temperature when thinking is active.
temperature: 1.0
# Whether the app may send image inputs to this profile.
vision: true

# Opus 5 thinks by default; adaptive is stated explicitly to keep the payload self-describing.
thinking:
  type: adaptive

# max is left for latency-insensitive one-off work: it may overthink
# conversational turns and increase request cost.
output_config:
  effort: xhigh
