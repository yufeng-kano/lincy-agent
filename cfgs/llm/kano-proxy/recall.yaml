# Kano Proxy Anthropic-compatible Messages API profile, not a Claude Code native proxy.
provider: kano_proxy
# Gateway model id used by this Kano Proxy profile.
model: recall-agent
# Dedicated Kano Proxy key. Do not fall back to ANTHROPIC_API_KEY.
api_key_env: KANO_PROXY_API_KEY
# Kano Proxy gateway root. The client appends /v1/messages.
base_url: https://kano-proxy.yuufeng.com/g/lincy/anthropic
# Output token cap: a few grep rounds plus a short bullet list.
max_tokens: 8000
# HTTP timeout in seconds; a prefetch runs before every user turn.
request_timeout: 30.0
# Sampling temperature. Anthropic omits temperature when thinking is active.
temperature: 1.0
# Text-only lookup agent.
vision: false
# Fast mode stays off: recall-agent resolves to Haiku 5.5, which rejects the
# speed field with 400. Set fast only once the group serves this profile from
# an Opus 5.5 target on the official API (claude-code targets answer 429).
speed: null

# Adaptive lets the gateway model skip thinking on trivial lookups.
thinking:
  type: adaptive

# Lookup, not judgement: medium keeps Haiku from answering NONE too early
# while staying fast enough to run before each user turn.
output_config:
  effort: medium
