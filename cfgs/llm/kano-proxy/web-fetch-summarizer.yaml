# Kano Proxy Anthropic-compatible Messages API profile, not a Claude Code native proxy.
provider: kano_proxy
# Gateway model id used by this Kano Proxy profile.
model: web-fetch-summarizer-agent
# Dedicated Kano Proxy key. Do not fall back to ANTHROPIC_API_KEY.
api_key_env: KANO_PROXY_API_KEY
# Kano Proxy gateway root. The client appends /v1/messages.
base_url: https://kano-proxy.yuufeng.com/anthropic
# Output token cap for this profile.
max_tokens: 32000
# HTTP timeout in seconds.
request_timeout: 600.0
# Sampling temperature. Anthropic omits temperature when thinking is active.
temperature: 1.0
# Whether the app may send image inputs to this profile.
vision: true

# Adaptive lets the gateway model skip thinking on trivial calls.
thinking:
  type: adaptive

# Summarizing fetched pages sits in the turn's critical path and needs no
# reasoning depth; speed wins.
output_config:
  effort: low
